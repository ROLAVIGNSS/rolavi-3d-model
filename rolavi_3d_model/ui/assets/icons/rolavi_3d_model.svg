<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0E2A44"/>
      <stop offset="1" stop-color="#07131F"/>
    </linearGradient>
    <linearGradient id="top" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6CC4FF"/>
      <stop offset="1" stop-color="#2E9BE6"/>
    </linearGradient>
    <linearGradient id="left" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0A86DE"/>
      <stop offset="1" stop-color="#0866AD"/>
    </linearGradient>
    <linearGradient id="right" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0662A8"/>
      <stop offset="1" stop-color="#044A80"/>
    </linearGradient>
    <clipPath id="tile"><rect x="16" y="16" width="480" height="480" rx="108"/></clipPath>
  </defs>
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bg)"/>
  <!-- the map: a georeferenced grid under the model -->
  <g clip-path="url(#tile)" stroke="#2B6E9E" stroke-width="5" fill="none" opacity="0.75">
    <polygon points="56,368 256,252 456,368 256,484"/>
    <line x1="106" y1="339" x2="306" y2="455"/>
    <line x1="156" y1="310" x2="356" y2="426"/>
    <line x1="206" y1="281" x2="406" y2="397"/>
    <line x1="106" y1="397" x2="306" y2="281"/>
    <line x1="156" y1="426" x2="356" y2="310"/>
    <line x1="206" y1="455" x2="406" y2="339"/>
  </g>
  <!-- the 3D model: a triangulated block -->
  <polygon points="256,158 364,220 256,282 148,220" fill="url(#top)"/>
  <polygon points="148,220 256,282 256,404 148,342" fill="url(#left)"/>
  <polygon points="256,282 364,220 364,342 256,404" fill="url(#right)"/>
  <g stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" opacity="0.38" fill="none">
    <line x1="202" y1="189" x2="310" y2="251"/>
    <line x1="310" y1="189" x2="202" y2="251"/>
    <line x1="148" y1="220" x2="364" y2="220"/>
    <line x1="148" y1="281" x2="256" y2="343"/>
    <line x1="202" y1="251" x2="202" y2="373"/>
    <line x1="148" y1="220" x2="256" y2="343"/>
    <line x1="256" y1="343" x2="364" y2="281"/>
    <line x1="310" y1="251" x2="310" y2="373"/>
    <line x1="364" y1="220" x2="256" y2="343"/>
  </g>
  <g stroke="#FFFFFF" stroke-width="6" stroke-linejoin="round" fill="none" opacity="0.92">
    <polygon points="256,158 364,220 364,342 256,404 148,342 148,220"/>
    <polyline points="148,220 256,282 364,220"/>
    <line x1="256" y1="282" x2="256" y2="404"/>
  </g>
  <!-- the signal: GNSS / ROLAVI -->
  <g stroke="#7FD3FF" stroke-width="16" stroke-linecap="round" fill="none">
    <path d="M 214 116 A 60 60 0 0 1 298 116"/>
    <path d="M 178 84 A 108 108 0 0 1 334 84" opacity="0.7"/>
  </g>
  <circle cx="256" cy="150" r="13" fill="#FFFFFF"/>
</svg>
